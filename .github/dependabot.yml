version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # minor / patch bumps land together in one PR. Major bumps open one PR per
      # package so each compatibility break (TypeScript, vitest, lucide, ...) is
      # judged on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no JavaScript compiler
      # API. Storybook's props docgen, Next.js type checking and
      # scripts/generate-llms.mjs all need that API, so stay on 6.x until they
      # support 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
