name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build library
        run: npm run build:lib

      # tsc does not rewrite path aliases, so an `@/` import that leaks into a
      # public type would be unresolvable for consumers.
      - name: Check published types have no path aliases
        run: |
          if grep -rn '"@/' dist/types; then
            echo 'dist/types contains "@/" imports. Use relative imports in exported types.' >&2
            exit 1
          fi

      - name: Check package contents
        run: npm pack --dry-run
