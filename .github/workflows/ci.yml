name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build library
        run: npm run build:lib

      # tsc does not rewrite path aliases, so an `@/` import that leaks into a
      # public type would be unresolvable for consumers.
      - name: Check published types have no path aliases
        run: |
          if grep -rn '"@/' dist/types; then
            echo 'dist/types contains "@/" imports. Use relative imports in exported types.' >&2
            exit 1
          fi

      - name: Check package contents
        run: npm pack --dry-run

      # The Next.js starter (examples/nextjs) must build against this package.
      # Its other dependencies resolve from the repository's node_modules.
      - name: Build the Next.js starter
        run: |
          mkdir -p "$RUNNER_TEMP/kaze" examples/nextjs/node_modules/kaze-design-system
          npm pack --pack-destination "$RUNNER_TEMP/kaze"
          tar -xzf "$RUNNER_TEMP"/kaze/kaze-design-system-*.tgz -C examples/nextjs/node_modules/kaze-design-system --strip-components=1
          cd examples/nextjs && NEXT_TELEMETRY_DISABLED=1 ../../node_modules/.bin/next build

      # Copy on the docs site, demos and README must follow the writing guide
      # (/docs/writing). Uses the kaze-copy CLI from the library just built.
      - name: Check Japanese copy
        run: npm run docs:check-copy

      # tokens.css and src/tokens/generated.ts are generated from tokens/*.tokens.json
      - name: Check tokens.css is up to date
        run: npm run tokens -- --check

      # Every usage example on the docs site must type-check against the real API
      - name: Check docs usage examples
        run: npm run docs:check-usage

      # llms.txt is generated from the component catalog; a stale copy means
      # AI assistants get wrong props.
      - name: Check llms.txt is up to date
        run: |
          npm run docs:llms
          git diff --exit-code -- public/llms.txt public/llms-full.txt src/views/docs/generated/props.json
