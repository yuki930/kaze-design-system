name: Publish Recovery

# One-off manual recovery: publish an already-tagged release to npm when the
# normal publish.yml run failed AFTER the version bump + tag were pushed
# (e.g. an expired NPM_TOKEN). Does NOT bump or tag anything — it publishes
# exactly what the given tag contains.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build library
        run: npm run build:lib

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
