name: Publish Recovery

# One-off manual recovery: publish an already-tagged release to npm when the
# normal publish.yml run failed AFTER the version bump + tag were pushed
# (e.g. an npm auth failure). Does NOT bump or tag anything — it publishes
# exactly what the given tag contains.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.5.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@11

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build library
        run: npm run build:lib

      - name: Publish to NPM
        # Authenticates via OIDC (npm Trusted Publisher), no NPM_TOKEN needed.
        # Provenance is attached automatically.
        run: npm publish --access public
